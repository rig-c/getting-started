name: adapter example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      try_it:
        description: 'Try it first: force a weekly-style run, poll latest, or run adapters only'
        type: choice
        options: [adapters, force, poll]
        default: adapters
  schedule:
    - cron: '17 3 * * 1-6'
    - cron: '17 3 * * 0'
permissions:
  contents: read
jobs:
  example:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.try_it == 'adapters')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/check-adapters.ts --install-system-deps
  try-it:
    if: github.event_name != 'workflow_dispatch' || inputs.try_it != 'adapters'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      changed: ${{ steps.walkthrough.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Extraction, defect, NOT RUN and no-op controls
        run: bun test scripts/try-it.test.ts
      - name: Run the guide against npm latest
        id: walkthrough
        env:
          TRY_IT_MODE: ${{ (github.event.schedule == '17 3 * * 1-6' || inputs.try_it == 'poll') && 'poll' || 'force' }}
        run: bun scripts/try-it.ts --mode "$TRY_IT_MODE"
      - name: Preserve the result, including failed steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: try-it-result
          path: |
            .try-it/receipt.json
            .try-it/summary.md
            .try-it/REFERENCE.md
            .try-it/walkthrough.log
            .try-it/browser.json
            .try-it/browser-*.png
          if-no-files-found: error
          retention-days: 14
  publish-tested-record:
    needs: try-it
    if: >-
      needs.try-it.outputs.changed == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: try-it-tested-record
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: try-it-result
          path: .try-it
      - name: Open or update the tested record PR and dispatch its checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/try-it-publish.ts .try-it
